# ===== Data =====

neural_data_folder_path: /Users/delacroix/Documents/Academia/Projects/Predictive Processing/data and code/ecog_data/npa/
simulation: false
simulation_neural_data_path: 

frequency_band: unfiltered
region: all

# ===== Models =====

models:
  - name: Spectrogram
    path: /Users/delacroix/Documents/Coding/dRSA/dRSA-Python/data/spectrogram.npy
    rdm_metric: cosine

  # - name: Wav2vec Phonetic
  #   path: ../data/wav2vec2-Large-avg9-12midLayers-Phone.npy
  #   rdm_metric: cosine

  # - name: Word2Vec
  #   path: ../data/word2vec-GoogleNews.npy
  #   rdm_metric: cosine

neural_rdm_metric: correlation

# ===== RSA method =====

rsa_computation_method: correlation                 # label — used in filenames, and picks the branch
custom_rsa_computation_module: PCR_dask     # only read if method != 'correlation'

# ===== Mask =====

mask: true
mask_path: /Users/delacroix/Documents/Coding/dRSA/dRSA-Python/data/mask_silence-p1s.npy

# ===== Parameters =====

n_subsamples: 20
subsampling_iterations: 50
subsample_duration_sec: 1.8

averaging_diagonal_time_window_sec: 1.5

resolution: 100

# ===== Time lock =====

time_lock: false # just aligns candidate indices at center
candidate_path: /Users/delacroix/Documents/Coding/dRSA/exploring models/candidate_start_tp-idx-Q25.npy


# ===== makeplot-only parameters, here for easy access =====

merge_model_plots: false           # true = one combined plot; false = grid, one row per model
save_subs_lags: false              # true = also dump subs_lags.npy (n_subs, n_models, n_lags)

TL_frame: false                    # time lock: averages diagonal only within the time lock frame
tps_from_center: 15                # tps from center to take for the frame

# ===== Other =====

double_precision: false
save_rsa_matrices: true
save_plots: true